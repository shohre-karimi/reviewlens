# Main ReviewLens configuration.
# Relative paths are resolved from the directory the command runs in (the project root).
# Unknown keys are rejected, so a typo here fails loudly instead of being ignored.

# Global seed for anything random outside the per-experiment seeds below.
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: artifacts/models
  results_dir: artifacts/results
  figures_dir: artifacts/figures

# Label schema. Label i in `labels` is encoded as integer i; -1 marks an unlabeled sample.
# A topic task would use e.g. name: topic, labels: [delivery, quality, price, support].
task:
  name: sentiment
  labels: [negative, positive]
  text_column: text
  label_column: label

# Raw dataset: Snappfood comments on Hugging Face, pinned to one revision.
# The official test.csv is the fixed test set; train.csv + validation.csv form the training pool.
data:
  hf_dataset: ParsiAI/snappfood-sentiment-analysis
  revision: d5e98012d86c2e368f8e72f636208dae347dec11
  train_files: [train.csv, validation.csv]
  test_file: test.csv
  raw_text_column: comment
  raw_label_column: label
  label_map:           # raw label -> task label
    SAD: negative
    HAPPY: positive
  min_text_chars: 2

# Text features. TF-IDF and LSA are fit on training texts only (labeled + unlabeled), never test.
features:
  analyzer: word         # word | char_wb (character n-grams inside word boundaries)
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.95
  max_features: 100000
  sublinear_tf: true
  lsa_components: 300    # dense LSA features, used by Label Spreading

# Hyperparameters per model (passed to the factories in src/reviewlens/models/).
# Library defaults on purpose: choosing values by looking at test scores would leak the test
# set into model selection, and with 1 % labels there is too little data for reliable tuning.
models:
  naive_bayes:
    alpha: 1.0
  logistic_regression:
    C: 1.0
  linear_svm:
    C: 1.0
  random_forest:
    n_estimators: 200
  # Semi-supervised methods (base model: Logistic Regression, same C as the baseline).
  self_training:
    threshold: 0.75      # scikit-learn's default
    max_iter: 10
    C: 1.0
  label_spreading:
    n_neighbors: 7       # scikit-learn's default
    alpha: 0.2           # scikit-learn's default
  pseudo_labeling:
    # With 1 % labels no negative prediction reaches 0.9 (median confidence ~0.57), so a
    # 0.9 threshold would add nothing; 0.7 was chosen from that label-free confidence
    # distribution, not from test scores.
    threshold: 0.7
    max_iter: 10
    growth: 1.0          # every class gains the same k labels; labeled set at most doubles
    C: 1.0

experiment:
  name: default
  label_fractions: [0.01, 0.05, 0.10, 0.20, 1.0]
  seeds: [0, 1, 2, 3, 4]   # vary the labeled/unlabeled masking and model randomness
  methods:
    - naive_bayes
    - logistic_regression
    - linear_svm
    - random_forest
    - self_training
    - label_spreading
    - pseudo_labeling

agent:
  provider: anthropic        # anthropic | openai_compatible
  max_steps: 5
  max_tokens: 4096           # per model response; thinking counts against it
  openai_base_url: null      # e.g. http://localhost:11434/v1 for Ollama
  # Saved model for analyze_review (artifacts/models/<classifier>.joblib). Create it with:
  #   reviewlens train -m logistic_regression -f 1.0 --save
  classifier: logistic_regression

logging:
  level: INFO
