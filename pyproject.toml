[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewlens"
version = "0.1.0"
description = "Semi-supervised sentiment classification of Persian customer reviews, with a tool-calling AI agent."
readme = "README.md"
requires-python = ">=3.11"
# Dependencies are added phase by phase, only when a module actually needs them.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "hazm>=0.12",
]

[project.optional-dependencies]
# Running the EDA notebook (VS Code / Jupyter) and executing it headless.
notebook = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
reviewlens = "reviewlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "N",       # pep8 naming
    "SIM",     # simplifications
    "RUF",     # ruff-specific rules
]
# RUF001-003 flag "ambiguous" unicode characters, which would fire on Persian text.
ignore = ["RUF001", "RUF002", "RUF003"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

# Libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["hazm", "hazm.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
